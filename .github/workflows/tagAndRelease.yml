name: Tag and Release

on:
  push:
    branches: ['master']
    paths-ignore: ['*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A green run should say what happened. Without a job that always runs, skipping the release
  # would leave the check grey and silent; this one reports the configuration state and
  # succeeds either way.
  config:
    runs-on: ubuntu-24.04
    steps:
      - name: Report the release configuration
        run: |
          set -euo pipefail
          if [ -z "${{ vars.REFERENCE_REGISTRY }}" ]; then
            echo "::notice::Tag and Release is skipped: vars.REFERENCE_REGISTRY is not set."
            echo "Set the three repository variables and the three release secrets listed in"
            echo "TODO.md to enable tagging; nothing else in this workflow can run without them."
          else
            echo "Release configuration is present; the tag job will run."
          fi

  tag:
    needs: config
    # The reusable workflow needs a reference registry and a developer signing key: it checks
    # that the version is not taken and signs the package before tagging it. Neither the
    # variables nor the secrets exist on this repository yet (the package is a private alpha
    # with no release pipeline), and passing the empty values through made every push fail in
    # ten seconds with `start-cli` exit 38 — a red check that said nothing about the package.
    #
    # So the release only runs where it can: when the reference registry is configured. Set
    #   vars.REFERENCE_REGISTRY, vars.RELEASE_REGISTRY, vars.S3_S9PKS_BASE_URL
    #   secrets.DEV_KEY, secrets.S3_ACCESS_KEY, secrets.S3_SECRET_KEY
    # and this job starts running again. Until then a push tags nothing and reports nothing
    # instead of failing a build over a pipeline that was never set up.
    if: ${{ vars.REFERENCE_REGISTRY != '' }}
    uses: Start9Labs/start-technologies/.github/workflows/tagAndRelease.yml@master
    with:
      REFERENCE_REGISTRY: ${{ vars.REFERENCE_REGISTRY }}
      RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
      S3_S9PKS_BASE_URL: ${{ vars.S3_S9PKS_BASE_URL }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    permissions:
      contents: write
